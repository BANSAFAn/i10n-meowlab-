name: Build & Release MeowLab i10n (Zig Portable)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-windows
            artifact: meowlab-i10n-windows-x64.exe
            bin: meowlab-i10n.exe
          - target: x86_64-linux-musl
            artifact: meowlab-i10n-linux-x64
            bin: meowlab-i10n
          - target: aarch64-macos
            artifact: meowlab-i10n-macos-arm64
            bin: meowlab-i10n
          - target: x86_64-macos
            artifact: meowlab-i10n-macos-x64
            bin: meowlab-i10n

    steps:
      - uses: actions/checkout@v4

      - name: Setup Zig 0.17.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Run Zig unit tests (host)
        if: matrix.target == 'x86_64-linux-musl'
        working-directory: app
        run: zig build test

      - name: Cross-compile portable binary (${{ matrix.target }})
        working-directory: app
        run: |
          zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe
          cp zig-out/bin/${{ matrix.bin }} ../${{ matrix.artifact }}

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
